
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <main class="quiz-container">

        <!-- Start Screen -->
        <section id="start-screen" class="screen">
            <div class="logo">Q</div>
            <h1>Welcome to QuizApp</h1>
            <p>Test your knowledge of web development!</p>
            <p class="instructions">
                Answer each question carefully and see your final score.
            </p>
            <button id="start-btn">Start Quiz</button>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="screen hidden">
            <div class="quiz-header">
                <span id="progress">Question 1 of 10</span>
                <span id="score-display">Score: 0</span>
            </div>

            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>

            <h2 id="question">Question appears here</h2>

            <div id="choices" class="choices"></div>

            <p id="feedback" aria-live="polite"></p>

            <button id="next-btn" disabled>Next</button>
        </section>

        <!-- Results Screen -->
        <section id="results-screen" class="screen hidden">
            <div class="trophy">🏆</div>
            <h1>Quiz Completed!</h1>
            <p id="final-score"></p>
            <p id="result-message"></p>
            <p id="high-score"></p>
            <button id="restart-btn">Restart Quiz</button>
        </section>

    </main>

</body>
</html>
